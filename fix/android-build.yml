name: Build Text Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check project layout
        shell: bash
        run: |
          pwd
          git ls-files
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/index.html; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing $f at repository root; check extracted ZIP layout."
              exit 1
            fi
          done

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Check build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          command -v sdkmanager

      - name: Install Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0'

      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build-log.txt

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: TextStudio-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TextStudio-Build-Log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 14
